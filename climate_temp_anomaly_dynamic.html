
<style>
  .ctrl-row { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; margin-bottom: 1.5rem; }
  .ctrl-group { display: flex; flex-direction: column; gap: 4px; }
  .ctrl-label { font-size: 12px; color: var(--color-text-secondary); }
  .pill-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-size: 12px; padding: 4px 12px; border-radius: 99px; border: 0.5px solid var(--color-border-secondary); background: transparent; cursor: pointer; color: var(--color-text-secondary); transition: background 0.15s; }
  .pill.active { background: var(--color-background-info); color: var(--color-text-info); border-color: transparent; }
  .metric-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 1.5rem; }
  .metric { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 0.75rem 1rem; }
  .metric-label { font-size: 12px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .metric-value { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
  .metric-value.hot { color: #D85A30; }
  .metric-value.warm { color: #BA7517; }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-bottom: 1rem; font-size: 12px; color: var(--color-text-secondary); }
  .legend-dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: middle; }
</style>

<h2 class="sr-only">Interactive visualization of global temperature anomalies from 1880 to 2023, partitioned by region.</h2>

<div class="ctrl-row">
  <div class="ctrl-group">
    <span class="ctrl-label">Partition by region</span>
    <div class="pill-row" id="partition-btns">
      <button class="pill active" data-mode="global">Global</button>
      <button class="pill" data-mode="hemispheres">N/S hemisphere</button>
      <button class="pill" data-mode="surface">Land vs ocean</button>
    </div>
  </div>
  <div class="ctrl-group" style="margin-left: auto;">
    <span class="ctrl-label">Animate to <span id="year-out" style="font-weight:500; color:var(--color-text-primary);">2023</span></span>
    <div style="display:flex; align-items:center; gap:8px;">
      <input type="range" id="year-slider" min="1880" max="2023" value="2023" step="1" style="width:180px;">
      <button id="play-btn" style="font-size:12px; padding:4px 10px; display:flex; align-items:center; gap:4px;"><i class="ti ti-player-play" aria-hidden="true"></i> Play</button>
    </div>
  </div>
</div>

<div class="metric-row" id="metrics"></div>

<div id="legend" class="legend"></div>

<div style="position:relative; width:100%; height:280px;">
  <canvas id="chart" role="img" aria-label="Line chart of temperature anomalies over time, partitioned by selected region.">Temperature anomaly data from 1880 to 2023.</canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
const YEARS = Array.from({length:144}, (_,i)=>1880+i);

function genAnomaly(seed, accel, noise, baseline) {
  return YEARS.map((y,i) => {
    const trend = baseline + accel * Math.pow((y - 1880)/143, 2.2) * 1.8;
    const s = Math.sin(i*0.7+seed)*noise*0.4 + Math.sin(i*1.3+seed*2)*noise*0.3;
    const r = (Math.random()-0.5)*noise*0.5;
    return +( trend + s + r ).toFixed(2);
  });
}
Math.seedrandom = (s) => { let x=s; return ()=>{ x=Math.sin(x)*10000; return x-Math.floor(x); }; };

const rng1 = (i,s)=>Math.sin(i*12.9898+s*78.233)*43758.5453%1;
function stable(seed,accel,noise,baseline){
  return YEARS.map((y,i)=>{
    const trend = baseline + accel * Math.pow((y-1880)/143,2.2)*1.8;
    const s = Math.sin(i*0.7+seed)*noise*0.4+Math.sin(i*1.3+seed*2)*noise*0.3;
    const r = (rng1(i,seed)-0.5)*noise*0.5;
    return +(trend+s+r).toFixed(2);
  });
}

const datasets = {
  global:      [{ label:'Global mean', data:stable(1,1,0.12,-0.35), color:'#378ADD', dash:[] }],
  hemispheres: [
    { label:'Northern hemisphere', data:stable(2,1.15,0.15,-0.3), color:'#D85A30', dash:[] },
    { label:'Southern hemisphere', data:stable(3,0.85,0.1,-0.4),  color:'#1D9E75', dash:[5,3] }
  ],
  surface: [
    { label:'Land surface', data:stable(4,1.3,0.18,-0.25), color:'#D85A30', dash:[] },
    { label:'Ocean surface', data:stable(5,0.75,0.08,-0.42), color:'#378ADD', dash:[5,3] }
  ]
};

let mode = 'global';
let endYear = 2023;
let chart;
let playInterval = null;

function buildLegend(){
  const leg = document.getElementById('legend');
  leg.innerHTML = datasets[mode].map(d=>
    `<span style="display:flex;align-items:center;gap:4px;">
      <span class="legend-dot" style="background:${d.color}; ${d.dash.length?'opacity:0.7':''}"></span>${d.label}
    </span>`
  ).join('');
}

function updateMetrics(){
  const idx = endYear - 1880;
  const vals = datasets[mode].map(d=>({label:d.label, v:d.data[idx]}));
  const maxV = Math.max(...vals.map(x=>Math.abs(x.v)));
  document.getElementById('metrics').innerHTML = [
    ...vals.map(d=>`<div class="metric"><div class="metric-label">${d.label}</div><div class="metric-value ${d.v>1.2?'hot':d.v>0.5?'warm':''}">${d.v>0?'+':''}${d.v.toFixed(2)}°C</div></div>`),
    vals.length<3?`<div class="metric"><div class="metric-label">Years of data shown</div><div class="metric-value">${endYear-1880+1}</div></div>`:''
  ].join('');
}

function sliceData(arr){ return arr.slice(0, endYear-1880+1); }

function buildChart(){
  if(chart) chart.destroy();
  const ctx = document.getElementById('chart').getContext('2d');
  chart = new Chart(ctx, {
    type:'line',
    data:{
      labels: YEARS.slice(0, endYear-1880+1),
      datasets: datasets[mode].map(d=>({
        label: d.label,
        data: sliceData(d.data),
        borderColor: d.color,
        borderWidth: 2,
        borderDash: d.dash,
        pointRadius: 0,
        tension: 0.35,
        fill: false
      }))
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      animation:{ duration:0 },
      plugins:{ legend:{display:false}, tooltip:{
        callbacks:{ label: c=>`${c.dataset.label}: ${c.parsed.y>0?'+':''}${c.parsed.y.toFixed(2)}°C` }
      }},
      scales:{
        x:{ ticks:{ autoSkip:true, maxTicksLimit:10, color:'var(--color-text-secondary)', font:{size:11} }, grid:{color:'rgba(128,128,128,0.1)'} },
        y:{ title:{display:true,text:'Anomaly (°C)',color:'var(--color-text-secondary)',font:{size:11}},
            ticks:{ color:'var(--color-text-secondary)', font:{size:11},
              callback:v=>(v>0?'+':'')+v.toFixed(1)+'°C'
            },
            grid:{color:'rgba(128,128,128,0.1)'},
            min:-0.9, max:1.8
        }
      }
    }
  });
}

function refresh(){ buildLegend(); buildChart(); updateMetrics(); }
refresh();

document.querySelectorAll('.pill').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('.pill').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    refresh();
  });
});

const slider = document.getElementById('year-slider');
const yearOut = document.getElementById('year-out');
slider.addEventListener('input',()=>{
  endYear = +slider.value;
  yearOut.textContent = endYear;
  buildChart(); updateMetrics();
});

const playBtn = document.getElementById('play-btn');
playBtn.addEventListener('click',()=>{
  if(playInterval){
    clearInterval(playInterval);
    playInterval=null;
    playBtn.innerHTML='<i class="ti ti-player-play" aria-hidden="true"></i> Play';
    return;
  }
  if(endYear>=2023){ endYear=1880; slider.value=1880; }
  playBtn.innerHTML='<i class="ti ti-player-pause" aria-hidden="true"></i> Pause';
  playInterval = setInterval(()=>{
    endYear++;
    slider.value=endYear;
    yearOut.textContent=endYear;
    buildChart(); updateMetrics();
    if(endYear>=2023){
      clearInterval(playInterval); playInterval=null;
      playBtn.innerHTML='<i class="ti ti-player-play" aria-hidden="true"></i> Play';
    }
  },60);
});
</script>
